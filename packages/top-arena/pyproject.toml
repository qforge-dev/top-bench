[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "top-arena"
version = "0.1.0"
description = "Typed, streaming client for the Top Arena audio-model benchmark"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "anyio>=4.14.2,<5",
  "httpx>=0.28.1,<0.29",
  "platformdirs>=4.4.0,<5",
]
