name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: top_arena_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d top_arena_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      TOP_ARENA_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/top_arena_ci
      TOP_ARENA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/top_arena_ci
      UV_NO_PROGRESS: "1"
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy

      - name: Verify database migration
        run: |
          uv run --no-sync alembic -c infra/alembic.ini upgrade head
          uv run --no-sync alembic -c infra/alembic.ini check

      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=term-missing

      - name: Verify dashboard JavaScript
        run: node --check apps/leaderboard/src/top_arena_server/static/dashboard.js
