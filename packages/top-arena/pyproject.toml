[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "top-arena"
version = "0.3.0"
description = "Run local audio models against the public Top Arena benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "QForge" },
]
requires-python = ">=3.13,<3.15"
keywords = [
  "audio",
  "benchmark",
  "guitar-amplifier",
  "machine-learning",
  "neural-audio",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.14.2,<5",
  "httpx>=0.28.1,<0.29",
  "platformdirs>=4.4.0,<5",
  "soundfile>=0.14.0,<0.15",
]

[project.urls]
Homepage = "https://top-arena.labqoat.com"
Documentation = "https://github.com/qforge-dev/top-bench/tree/main/packages/top-arena"
Repository = "https://github.com/qforge-dev/top-bench"
Issues = "https://github.com/qforge-dev/top-bench/issues"
