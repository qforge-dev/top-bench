[project]
name = "top-bench-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/top-arena", "apps/leaderboard"]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy==2.3.1",
  "pedalboard==0.9.24",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "types-boto3[s3]==1.43.75",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["packages/top-arena/tests", "apps/leaderboard/tests"]

[tool.coverage.run]
branch = true
source = ["top_arena", "top_arena_server"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "C901",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "S104",
  "TC001",
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/top-arena/src", "apps/leaderboard/src"]
exclude = [".venv"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "soundfile"]
ignore_missing_imports = true
