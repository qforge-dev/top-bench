name: Publish Python package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-package.yml"
      - "packages/top-arena/**"

permissions:
  contents: read

concurrency:
  group: publish-top-arena
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      UV_NO_PROGRESS: "1"
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Verify SDK
        run: |
          uv run --no-sync ruff format --check packages/top-arena
          uv run --no-sync ruff check packages/top-arena
          uv run --no-sync mypy packages/top-arena/src
          uv run --no-sync pytest packages/top-arena/tests

      - name: Select immutable PyPI version
        id: version
        run: |
          base_version=$(uv version --short --package top-arena)
          publish_version="${base_version}.post${GITHUB_RUN_NUMBER}"
          uv version --frozen --package top-arena "$publish_version"
          echo "version=${publish_version}" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution
        run: uv build --package top-arena --out-dir dist

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Verify wheel in a clean environment
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/top-arena-smoke"
          uv pip install --python "$RUNNER_TEMP/top-arena-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/top-arena-smoke/bin/python" - <<'PY'
          import os

          import top_arena

          assert top_arena.__version__ == os.environ["EXPECTED_VERSION"]
          assert top_arena.benchmark.DEFAULT_SERVER_URL == "https://top-arena.labqoat.com"
          PY

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: top-arena-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.version }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/top-arena/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Authenticate to PyPI with a short-lived trusted-publisher token.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: top-arena-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
